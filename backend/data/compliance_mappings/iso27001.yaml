# ISO 27001:2022 — Finding Category to Control ID Mapping
# This file is the authoritative source. The LLM applies these mappings,
# but does NOT invent control IDs. Edit this file to update mappings.
# Version: 2022-01

version: "2022-01"
framework: "ISO27001"

mappings:
  "Secrets":
    control_id: "A.8.12"
    control_name: "Data leakage prevention"
    secondary:
      - "A.9.4.3"  # Password management system
      - "A.8.10"   # Information deletion

  "OWASP-A01":
    control_id: "A.8.25"
    control_name: "Secure development life cycle"
    secondary:
      - "A.8.26"  # Application security requirements
      - "A.8.28"  # Secure coding

  "OWASP-A02":
    control_id: "A.8.7"
    control_name: "Protection against malware"
    secondary:
      - "A.5.33"  # Protection of records

  "OWASP-A03":
    control_id: "A.8.28"
    control_name: "Secure coding"
    secondary:
      - "A.8.25"  # Secure development life cycle

  "OWASP-A05":
    control_id: "A.8.9"
    control_name: "Configuration management"
    secondary:
      - "A.8.8"   # Management of technical vulnerabilities

  "OWASP-A06":
    control_id: "A.8.8"
    control_name: "Management of technical vulnerabilities"

  "OWASP-A07":
    control_id: "A.9.4.1"
    control_name: "Information access restriction"
    secondary:
      - "A.9.1.1"  # Access control policy

  "IaC-Misconfiguration":
    control_id: "A.8.9"
    control_name: "Configuration management"
    secondary:
      - "A.5.37"  # Documented operating procedures

  "Dockerfile":
    control_id: "A.8.9"
    control_name: "Configuration management"
    secondary:
      - "A.8.8"   # Management of technical vulnerabilities

  "Incident":
    control_id: "A.5.25"
    control_name: "Assessment and decision on information security events"
    secondary:
      - "A.5.26"  # Response to information security incidents

  "CVE":
    control_id: "A.8.8"
    control_name: "Management of technical vulnerabilities"

  "Remediation":
    control_id: "A.5.26"
    control_name: "Response to information security incidents"

  "Compliance-ISO27001":
    control_id: "A.5.35"
    control_name: "Independent review of information security"
